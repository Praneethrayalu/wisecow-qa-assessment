[pytest]
testpaths = tests
addopts = -ra --strict-markers
junit_family = xunit2
timeout = 180
filterwarnings =
    ignore:ssl.TLSVersion.TLSv1:DeprecationWarning
markers =
    unit: no network or Docker needed (handler and ops-script unit tests)
    static: file checks of Dockerfile, manifests, KubeArmor policy and workflow
    live: black-box HTTP tests against a running wisecow (WISECOW_URL or WISECOW_IMAGE)
    docker: Docker runtime tests of the image (WISECOW_IMAGE)
    cluster: ingress/TLS/live-cluster tests (WISECOW_TLS_URL, WISECOW_CA_CERT, KUBECTL)
